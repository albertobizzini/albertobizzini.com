name: Deploy AlbertoBizzini.com to Cloudflare Pages

on:
  push:
    branches:
      - master
      - staging
    paths:
      - 'AlbertoBizzini.Web/**'
      - 'AlbertoBizzini.Shared/**'
      - 'KindleClippings.Parser/**'
      - '.github/workflows/deploy.yml'
      
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM
        run: |
          dotnet publish AlbertoBizzini.Web/AlbertoBizzini.Web.csproj \
            -c Release \
            -o release

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy release/wwwroot --project-name=albertobizzini-com --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
